replicaCount: 1
image:
  repository: frontend
  tag: v1.0.0
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  host: tasks.local
  path: /
  tls: []
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
api:
  serviceName: api
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
secret:
  create: false
  data: {}
serviceMonitor:
  enabled: false
  release: kube-prometheus-stack
  interval: 30s
