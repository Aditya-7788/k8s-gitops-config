replicaCount: 1
image:
  repository: worker
  tag: v1.0.0
  pullPolicy: IfNotPresent
service:
  port: 8001
env:
  API_URL: http://api:8000
  WORKER_INTERVAL_SECONDS: "10"
  LOG_LEVEL: info
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 150m
    memory: 64Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: false
  className: nginx
  host: worker.tasks.local
  path: /
secret:
  create: false
  data: {}
serviceMonitor:
  enabled: true
  release: kube-prometheus-stack
  interval: 30s
