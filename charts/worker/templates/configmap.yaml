apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "worker.fullname" . }}-config
  labels:
    {{- include "worker.labels" . | nindent 4 }}
data:
  API_URL: {{ .Values.env.API_URL | quote }}
  WORKER_INTERVAL_SECONDS: {{ .Values.env.WORKER_INTERVAL_SECONDS | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
