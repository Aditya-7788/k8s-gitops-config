apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Aditya-7788/k8s-gitops-config.git
    targetRevision: main
    path: apps/children
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
