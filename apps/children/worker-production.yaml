apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker-production
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Aditya-7788/k8s-gitops-config.git
      targetRevision: main
      path: charts/worker
      helm:
        releaseName: worker
        valueFiles:
          - $values/environments/production/worker.yaml
    - repoURL: https://github.com/Aditya-7788/k8s-gitops-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
