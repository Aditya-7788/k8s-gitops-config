apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Aditya-7788/k8s-gitops-config.git
      targetRevision: main
      path: charts/frontend
      helm:
        releaseName: frontend
        valueFiles:
          - $values/environments/staging/frontend.yaml
    - repoURL: https://github.com/Aditya-7788/k8s-gitops-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
