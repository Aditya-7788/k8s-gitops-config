apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aditya-7788/k8s-gitops-config.git
    targetRevision: main
    path: platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
