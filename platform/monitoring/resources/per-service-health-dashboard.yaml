apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: task-manager
data:
  per-service-health.json: |
    {
      "uid": "task-service-health",
      "title": "Per-Service Health",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "HTTP request rate", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "sum by (namespace, path) (rate(http_requests_total[5m]))", "legendFormat": "{{namespace}} {{path}}"}]},
        {"id": 2, "type": "timeseries", "title": "HTTP error rate", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "sum by (namespace, status) (rate(http_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "{{namespace}} {{status}}"}]},
        {"id": 3, "type": "timeseries", "title": "Pod CPU cores", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"staging|production\",container!=\"\",pod!=\"\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}}"}]},
        {"id": 4, "type": "timeseries", "title": "Pod memory bytes", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"staging|production\",container!=\"\",pod!=\"\"})", "legendFormat": "{{namespace}}/{{pod}}"}]},
        {"id": 5, "type": "timeseries", "title": "Pod restarts", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8}, "targets": [{"expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"staging|production\"}[1h]))", "legendFormat": "{{namespace}}/{{pod}}"}]},
        {"id": 6, "type": "timeseries", "title": "Node exporter availability", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8}, "targets": [{"expr": "up{job=~\".*node-exporter.*\"}", "legendFormat": "{{instance}}"}]}
      ]
    }
