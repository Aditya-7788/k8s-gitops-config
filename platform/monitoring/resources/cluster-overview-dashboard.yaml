apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: task-manager
data:
  cluster-overview.json: |
    {
      "uid": "task-cluster-overview",
      "title": "Cluster Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Node CPU usage", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "legendFormat": "{{instance}}"}]},
        {"id": 2, "type": "timeseries", "title": "Node memory used", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{instance}}"}]},
        {"id": 3, "type": "timeseries", "title": "Pod restarts (5m)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[5m]))", "legendFormat": "{{namespace}}/{{pod}}"}]},
        {"id": 4, "type": "timeseries", "title": "Ready pods", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum by (namespace) (kube_pod_status_ready{condition=\"true\"})", "legendFormat": "{{namespace}}"}]}
      ]
    }
