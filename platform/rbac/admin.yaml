apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-admin
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-admin
subjects:
  - kind: ServiceAccount
    name: gitops-admin
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
